name: Generate FlexFL Buggy Program

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FlexFL repository
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          java -version
          mvn -version
          python3 --version
          git --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            subversion \
            perl \
            cpanminus \
            libdbi-perl \
            libdbd-csv-perl \
            libtext-csv-perl \
            curl \
            unzip \
            maven

      - name: Install Defects4J
        run: |
          cd tools

          git clone https://github.com/rjust/defects4j.git defects4j-2.0.0
          cd defects4j-2.0.0

          git checkout v2.0.0

          sudo cpanm --installdeps .

          ./init.sh

          echo "$(pwd)/framework/bin" >> "$GITHUB_PATH"
          
      - name: Verify Perl dependencies
        run: |
          perl -MDBI -e 'print "DBI OK\n"'
          perl -MDBD::CSV -e 'print "DBD CSV OK\n"'
     
      - name: Verify Defects4J
        run: |
          tools/defects4j-2.0.0/framework/bin/defects4j info -p Time

      - name: Show selected bugs
        run: |
          cat prepare/buggy_program/bug_list.txt

      - name: Checkout buggy and fixed repositories
        working-directory: prepare/buggy_program
        run: |
          bash checkout.sh

      - name: Inspect checked-out repositories
        run: |
          find prepare/buggy_program/Collect_Methods/repos \
            -maxdepth 1 \
            -type d \
            -print

      - name: Generate Java file lists
        working-directory: prepare/buggy_program
        run: |
          python3 get_files.py

      - name: Build method extractor
        working-directory: prepare/buggy_program/Collect_Methods
        run: |
          mvn clean install

      - name: Extract methods
        working-directory: prepare/buggy_program/Collect_Methods
        run: |
          bash run.sh
      - name: Prepare FlexFL buggy program input
        run: |
          mkdir -p FlexFL/data/input/buggy_program/Defects4J

          cp prepare/buggy_program/methods_buggy_Defects4j/* \
             FlexFL/data/input/buggy_program/Defects4J/

      - name: Verify FlexFL buggy program input
        run: |
          echo "Generated FlexFL buggy-program files:"
          ls -lh FlexFL/data/input/buggy_program/Defects4J/
  
          echo
          echo "Number of generated files:"
          find FlexFL/data/input/buggy_program/Defects4J -type f | wc -l
      
          echo
          echo "Files per bug:"
          for bug in Time-25 Chart-1 Cli-1 Lang-1 Math-1
          do
            echo "=== $bug ==="
            ls FlexFL/data/input/buggy_program/Defects4J/${bug}* || true
          done


      - name: Commit generated buggy-program files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add FlexFL/data/input/buggy_program/Defects4J/
      
          if git diff --cached --quiet; then
            echo "No new buggy-program files to commit."
          else
            git commit -m "Add generated FlexFL buggy-program inputs"
            git push
          fi
          
      - name: Test original FlexFL function calls
        working-directory: FlexFL/src
        run: |
            pip install python-Levenshtein
        
            python3 - <<'PY'
            from function_call import find_class, find_method, get_methods
        
            bug = "Time-25"
            dataset = "Defects4J"
        
            print("=== find_class ===")
            print(find_class(bug, "DateTimeZone", dataset))
        
            print("\n=== find_method ===")
            print(find_method(bug, "getOffsetFromLocal", dataset))
        
            print("\n=== get_methods ===")
            print(get_methods(bug, "org.joda.time.DateTimeZone", dataset))
            PY
      
      
      
      
      - name: Inspect generated files
        run: |
          echo "Buggy methods:"
          find prepare/buggy_program/methods_buggy_Defects4j \
            -type f | head -20

          echo "Fixed methods:"
          find prepare/buggy_program/methods_fixed_Defects4j \
            -type f | head -20

          du -sh prepare/buggy_program/methods_buggy_Defects4j || true
          du -sh prepare/buggy_program/methods_fixed_Defects4j || true

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: FlexFL-Time25-method-data
          path: |
            prepare/buggy_program/methods_buggy_Defects4j
            prepare/buggy_program/methods_fixed_Defects4j
            prepare/buggy_program/file_lists_buggy
            prepare/buggy_program/file_lists_fixed
          retention-days: 5
